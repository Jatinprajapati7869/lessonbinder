[package]
name = "anki-bridge"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anki = { path = "/home/xingzi/Documents/anki-main/rslib", package = "anki" }
anki_io = { path = "/home/xingzi/Documents/anki-main/rslib/io", package = "anki_io" }
anki_proto = { path = "/home/xingzi/Documents/anki-main/rslib/proto", package = "anki_proto" }
snafu = { version = "0.8.6", features = ["rust_1_61"] }
fs2 = "0.4"
sha2 = "0.10"
regex = "1.11"
thiserror = "2.0"
vault-core = { path = "../vault-core" }
# Feature unification: `anki` expects these tokio features when built outside the anki-main workspace.
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3.14"
